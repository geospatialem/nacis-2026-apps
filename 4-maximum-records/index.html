<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Maximum Records</title>

    <script type="importmap">
      {
        "imports": {
          "esri/": "https://jsdev.arcgis.com/5.2/@arcgis/core/",
          "@arcgis/core/": "https://jsdev.arcgis.com/5.2/@arcgis/core/"
        }
      }
    </script>

    <script type="module">
      const importUnwrapDefault = async (moduleName) => {
        const isCoreImport = moduleName.startsWith("@arcgis/core/") || moduleName.startsWith("esri/");
        const withExtension = isCoreImport && !moduleName.endsWith(".js") ? `${moduleName}.js` : moduleName;
        const mod = await import(withExtension);

        if (isCoreImport && "default" in mod) {
          return mod.default;
        }

        return mod;
      };

      globalThis.$arcgis = {
        async import(moduleOrModules) {
          if (Array.isArray(moduleOrModules)) {
            return Promise.all(moduleOrModules.map(importUnwrapDefault));
          }

          return importUnwrapDefault(moduleOrModules);
        },
      };
    </script>

    <script>
      globalThis.$arcgis ??= {};
      globalThis.$arcgis.forceESM = true;
    </script>
    <script type="module" src="https://jsdev.arcgis.com/5.2/index.js"></script>

    <style>
      :root {
        color-scheme: light;
      }

      :root.calcite-mode-dark {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!-- Note: popup-component-enabled enables the Popup component (beta). See https://developers.arcgis.com/javascript/latest/references/map-components/components/arcgis-map/#popupComponentEnabled for details. -->
    <arcgis-map basemap="gray-vector" zoom="10" center="-73.95, 40.702" popup-component-enabled focus-region-visible>
      <arcgis-zoom slot="top-left"></arcgis-zoom>
    </arcgis-map>

    <script type="module">
      //# sourceURL=play-app.js
      const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");
      // Get a reference to the map component
      const viewElement = document.querySelector("arcgis-map");
      await viewElement.viewOnReady();
      const template = {
        // autocasts as new PopupTemplate()
        title: "{NAME} in {COUNTY}",
        content: [
          {
            // It is also possible to set the fieldInfos outside of the content
            // directly in the popupTemplate. If no fieldInfos is specifically set
            // in the content, it defaults to whatever may be set within the popupTemplate.
            type: "fields",
            fieldInfos: [
              {
                fieldName: "B12001_calc_pctMarriedE",
                label: "Married %",
              },
              {
                fieldName: "B12001_calc_numMarriedE",
                label: "People Married",
                fieldFormat: {
                  type: "number",
                  useGrouping: "always",
                  maximumFractionDigits: 0,
                },
              },
              {
                fieldName: "B12001_calc_numNeverE",
                label: "People that Never Married",
                fieldFormat: {
                  type: "number",
                  useGrouping: "always",
                  maximumFractionDigits: 0,
                },
              },
              {
                fieldName: "B12001_calc_numDivorcedE",
                label: "People Divorced",
                fieldFormat: {
                  type: "number",
                  useGrouping: "always",
                  maximumFractionDigits: 0,
                },
              },
            ],
          },
        ],
      };
      // Reference the popupTemplate instance in the
      // popupTemplate property of FeatureLayer
      const featureLayer = new FeatureLayer({
        url: "https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/ACS_Marital_Status_Boundaries/FeatureServer/2",
        popupTemplate: template,
      });
      // Add the layer to the map component
      viewElement.map.layers.add(featureLayer);
    </script>
  </body>
</html>
